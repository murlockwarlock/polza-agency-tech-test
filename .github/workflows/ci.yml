name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: polza
          POSTGRES_USER: polza
          POSTGRES_PASSWORD: polza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polza -d polza"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://polza:polza@localhost:5432/polza
      DATA_DIR: data/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:schema
      - run: npm run import:all
      - run: npm run db:verify
      - run: npm run build
